version: '3.8'
services:
  mysql-db:
    image: mysql:8.0
    container_name: telekom-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: telekom_db
      MYSQL_USER: telekom_user
      MYSQL_PASSWORD: telekom_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
