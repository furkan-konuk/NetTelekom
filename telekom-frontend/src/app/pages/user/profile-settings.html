<div class="animate-fade-in-up w-full">
  
  <div class="mb-8 border-b border-slate-200 pb-4">
    <h1 class="text-3xl font-light text-slate-800 mb-2">Kişisel Bilgilerim</h1>
    <div class="flex items-center text-sm font-medium text-slate-500 gap-2">
      <span class="hover:text-net-accent cursor-pointer transition-colors">Hesabım</span>
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" /></svg>
      <span class="text-slate-800 font-bold">Kişisel Bilgiler</span>
    </div>
  </div>

  <div class="max-w-4xl">
    
    <!-- Tabs -->
    <div class="flex border-b border-slate-200 mb-8">
      <button (click)="setTab('iletisim')" 
              class="px-8 py-4 font-bold text-sm transition-all border-b-2"
              [ngClass]="activeTab() === 'iletisim' ? 'border-net-primary text-net-primary' : 'border-transparent text-slate-500 hover:text-slate-700'">
        İletişim Bilgileri
      </button>
      <button (click)="setTab('sifre')" 
              class="px-8 py-4 font-bold text-sm transition-all border-b-2"
              [ngClass]="activeTab() === 'sifre' ? 'border-net-primary text-net-primary' : 'border-transparent text-slate-500 hover:text-slate-700'">
        Şifre İşlemleri
      </button>
    </div>

    @if (isSuccess()) {
      <div class="mb-8 bg-green-50 border-l-4 border-green-500 p-4 rounded-r-xl flex items-center gap-3 animate-fade-in-up">
        <svg class="w-6 h-6 text-green-500" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
        <span class="text-green-800 font-medium">{{ successMessage() }}</span>
      </div>
    }

    <!-- İletişim Bilgileri Tab -->
    @if (activeTab() === 'iletisim') {
      <div class="bg-white rounded-3xl p-8 border border-slate-200 shadow-sm animate-fade-in">
        <div class="flex flex-col gap-6 max-w-xl">
          <div>
            <label class="block text-sm font-medium text-slate-600 mb-1">E-Posta Adresi</label>
            <input type="email" [(ngModel)]="profile.email" class="w-full h-12 bg-slate-50 border border-slate-200 rounded-xl px-4 outline-none focus:border-net-primary focus:ring-1 focus:ring-net-primary" />
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-600 mb-1">İletişim Numarası</label>
            <input type="text" [(ngModel)]="profile.phone" class="w-full h-12 bg-slate-50 border border-slate-200 rounded-xl px-4 outline-none focus:border-net-primary focus:ring-1 focus:ring-net-primary" />
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-600 mb-1">Fatura Adresi</label>
            <textarea [(ngModel)]="profile.address" rows="3" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-4 outline-none focus:border-net-primary focus:ring-1 focus:ring-net-primary resize-none"></textarea>
          </div>
          <button (click)="saveProfile()" class="w-full py-4 mt-4 bg-net-primary text-white font-bold rounded-xl shadow-lg hover:bg-net-accent transition-colors">
            Değişiklikleri Kaydet
          </button>
        </div>
      </div>
    }

    <!-- Şifre İşlemleri Tab -->
    @if (activeTab() === 'sifre') {
      <div class="bg-white rounded-3xl p-8 border border-slate-200 shadow-sm animate-fade-in">
        <p class="text-slate-500 mb-8">Hesap güvenliğiniz için şifrenizi düzenli olarak değiştirmenizi öneririz.</p>
        <div class="flex flex-col gap-6 max-w-xl">
          <div>
            <label class="block text-sm font-medium text-slate-600 mb-1">Mevcut Şifre</label>
            <input type="password" [(ngModel)]="passwords.current" class="w-full h-12 bg-slate-50 border border-slate-200 rounded-xl px-4 outline-none focus:border-net-primary focus:ring-1 focus:ring-net-primary" />
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-600 mb-1">Yeni Şifre</label>
            <input type="password" [(ngModel)]="passwords.newPass" class="w-full h-12 bg-slate-50 border border-slate-200 rounded-xl px-4 outline-none focus:border-net-primary focus:ring-1 focus:ring-net-primary" />
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-600 mb-1">Yeni Şifre (Tekrar)</label>
            <input type="password" [(ngModel)]="passwords.newPassConfirm" class="w-full h-12 bg-slate-50 border border-slate-200 rounded-xl px-4 outline-none focus:border-net-primary focus:ring-1 focus:ring-net-primary" />
          </div>
          <button (click)="updatePassword()" [disabled]="!passwords.newPass || !passwords.newPassConfirm" class="w-full py-4 mt-4 bg-net-primary text-white font-bold rounded-xl shadow-lg hover:bg-net-accent transition-colors disabled:opacity-50">
            Şifreyi Güncelle
          </button>
        </div>
      </div>
    }

  </div>
</div>
